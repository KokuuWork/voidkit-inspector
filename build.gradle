plugins {
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

// ==============================================================
// Voidkit Inspector —— 操作审计查询（COI）
//
// 从 Voidkit 套件里拆出的独立模组：记录方块 / 容器 / 实体操作到嵌入式 SQLite，
// 内置科技整合包（机械动力 / Mek / AE2）自动化产线过滤。
//
// 依赖 voidkit_core 前置：
//   - 编译期：compileOnly libs/ 下的 core jar（用 ./fetch-core.sh 下载）
//   - 运行期：由 mods.toml 声明 required，服主同时装 voidkit_core 即可
// ==============================================================

group = 'org.voidkit'
// 与 voidkit 套件其余模块同一规格：<mod>-0.1.0-beta.1+mc<版本>-<加载器>.jar
version = '0.1.0-beta.1'

base { archivesName = 'voidkit_inspector' }

ext {
    mcVersion = '1.21.1'
    // voidkit_core 的版本 —— **独立于本插件版本**（两个插件各自发版，节奏不同）。
    // 拿本插件版本去写 core 的依赖区间是最隐蔽的坑：区间不匹配 → mod 被静默跳过。
    coreVersion = '0.1.0-beta.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin { jvmToolchain(21) }

repositories {
    // NeoForge 制品国内被 DNS 污染，走官方 CDN（详见 mirror.init.gradle）
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

neoForge {
    version = '21.1.209'
    mods {
        'voidkit_inspector' {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        // 开发服务端：core + inspector 都从 classpath 加载，与整合包真实加载路径一致
        server {
            server()
            programArgument '--nogui'
            // 与下面的 client run 共用一个目录约定，便于清理与查看产物
            gameDirectory = file('build/devserver')
        }

        // 开发客户端：**Inspector 是纯服务端模组，没有客户端 jar** —— 这个 run
        // 起的是**光秃秃的原版 1.21.1 客户端**，唯一任务是当「真人玩家」连进上面的
        // 开发服务端，走一遍真实的登录 → 破坏 → 审计入库链路。
        // E2E 脚本只能验「模组被加载 + 库被建」，验不到「玩家操作真的被记下来」。
        //
        // ⚠️ `loadedMods` 清空是关键：**客户端不加载 inspector 本身**（真实世界里
        //    玩家装的就是原版客户端），只留 NeoForge 本体。
        //    不清空的话 inspector 会作为 mod 出现在客户端 —— 而它的
        //    mods.toml 声明 `side = "SERVER"` 且依赖 core，客户端侧必然加载失败。
        client {
            client()
            // ⚠️ Groovy 的 SetProperty 没有 clear()，必须 `set([])`
            loadedMods.set([] as Set)
            gameDirectory = file('build/devclient')
            // ⚠️ 必须用**离线账号**（--accessToken 0 + 固定 uuid），
            //    否则 dev launcher 会去 Mojang 认证，本机没正版账号直接卡在登录界面。
            programArgument '--username'
            programArgument 'VoidkitTester'
            programArgument '--uuid'
            programArgument '00000000-0000-0000-0000-000000000001'
            programArgument '--accessToken'
            programArgument '0'
            // 直连开发服务端，省掉「进游戏再点多人游戏」的鼠标操作
            programArgument '--server'
            programArgument '127.0.0.1'
            programArgument '--port'
            programArgument '25565'
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'

    // core 前置：编译期依赖（compileOnly），运行时由服主同装 voidkit_core。
// ⚠️ 用 fileTree 通配而不是写死文件名 —— core 的版本号与命名规格会变，
//    写死会导致「fetch-core.sh 下到了，但编译期看不到 core」这种难查的问题。
    // Kotlin 运行时也由 core jar 携带（core 是唯一 jarJar kotlin 的），这里不重复 jarJar。
    compileOnly fileTree(dir: 'libs', include: ['voidkit_core-*.jar'])

    // 单元测试（ChainCluster 聚类逻辑是纯数据计算，不需要起 MC 服务端）。
    // core 是 compileOnly，不进 test classpath —— 这里补一份，保证测试编译符号完整。
    testImplementation fileTree(dir: 'libs', include: ['voidkit_core-*.jar'])
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 嵌入式 SQLite 驱动：jarJar 打进本 jar（版本区间只锁下界，让 FML 仲裁）。
    jarJar(implementation('org.xerial:sqlite-jdbc')) {
        version {
            strictly '[3.46,)'
            prefer '3.53.4.0'
        }
    }
}

// ⚠️ 开发运行时（runServer）从 classes 目录加载本模组，**jarJar 的嵌套 jar 不生效**，
//    所以 SQLite 原生库必须显式补进 run 的 classpath。
//
// 🚨 **kotlin-stdlib 与 core 都不要再补** —— 两者都已由
//    `build/devserver/mods/voidkit_core-*.jar` 里的 jarJar 提供。
//    再补一份会得到（E2E 实测，dev run 首次启动即崩）：
//      `ResolutionException: Module neoforge.coremods reads more than one module
//       named kotlin.stdlib`
//    —— JPMS 看到两个同名 kotlin.stdlib 模块（core 的嵌套 jar + classpath 上的独立 jar），
//    直接拒绝解析。ModDevGradle 下 jarJar 与 additionalRuntimeClasspath 只能二选一。
//
//    core 之所以放`mods/` 而不是 classpath：`additionalRuntimeClasspath` 只提供**类**，
//    FML 仍认为该 mod 未安装，会报
//    `Mod voidkit_inspector requires voidkit_core … Currently, voidkit_core is not installed`。
//    dev launch 会扫 gameDirectory/mods/，放进去才被 FML 当合法 mod 加载。
afterEvaluate {
    dependencies {
        additionalRuntimeClasspath 'org.xerial:sqlite-jdbc:3.53.4.0'
    }
}

// dev 服务端启动前自动把 libs/ 下的 core jar 同步到 mods/。
// 少了这一步 runServer 就会报 core 未安装（而报错信息完全看不出是缺 mods/ 里的文件）。
def syncCoreToDevServer = tasks.register('syncCoreToDevServer', Copy) {
    from fileTree(dir: 'libs', include: ['voidkit_core-*.jar'])
    into layout.projectDirectory.dir('build/devserver/mods')
}

// dev 测试环境的固定配置。
//
// 🚨 **服务端启动时会把 server.properties / ops.json 读进来再写回去**，
//    所以手工改这两个文件会被下次启动覆盖 —— 必须在 runServer 之前由 Gradle 写。
//
// 内容：
//   * 离线模式 + 创造 + 超平坦：一进服就能操作，不用等调参
//   * RCON：让脚本能自动发 `/coi ...` 这类命令验证命令链路，
//     比让人手敲键盘再翻日志可靠得多（密码仅 dev 用）
def syncDevServerConfig = tasks.register('syncDevServerConfig') {
    def dir = layout.projectDirectory.dir('build/devserver')
    outputs.files(dir.file('server.properties'), dir.file('ops.json'), dir.file('eula.txt'))
    // 必须每次都重写：服务端运行期间会把这两个文件按内存状态写回去
    //（比如把 VoidkitTester 从 op 列表里去掉），不重写下次启动就丢配置。
    outputs.upToDateWhen { false }
    doLast {
        def d = dir.asFile
        d.mkdirs()

        new File(d, 'eula.txt').text = 'eula=true\n'

        // 用 List.join('\n') 而不是 ''' 三引号：
        // 三引号里任何续行/转义组合都会把 Groovy 词法分析器带沟里
        // （E2E 实测：`Unexpected character: '\''`，而且报的列号指向三引号本身，看不出真因）。
        // 另一个坑：properties 里必须转义 `:`（`minecraft\:flat`），双引号串天然规避。
        def props = [
                'online-mode'                : 'false',
                'level-name'                 : 'devworld',
                'level-type'                 : 'minecraft:flat',
                'generator-settings'         : '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}',
                'max-players'                : '5',
                'view-distance'              : '6',
                'simulation-distance'        : '6',
                'spawn-protection'           : '0',
                'gamemode'                   : 'creative',
                'difficulty'                 : 'peaceful',
                'sync-chunk-writes'          : 'false',
                'enable-jmx-monitoring'      : 'false',
                // RCON：让脚本能自动发 `/coi ...` 验证命令链路，
                // 比让人手敲键盘再翻日志可靠得多（密码仅 dev 用）
                'enable-rcon'                : 'true',
                'rcon.password'              : 'devtest123',
                'rcon.port'                  : '25575',
                'broadcast-rcon-to-ops'      : 'true',
        ]
        new File(d, 'server.properties').text =
                props.collect { k, v -> k + '=' + v }.join('\n') + '\n'

        // 测试账号直接给 level 4 —— 否则所有 `/coi` 系命令都「Unknown command」
        new File(d, 'ops.json').text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([[
                        uuid         : 'b85366b837e637cda6b5442553385c92',
                        name         : 'VoidkitTester',
                        level        : 4,
                        bypassesPlayerLimit: false,
                ]]))
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn syncCoreToDevServer
    dependsOn syncDevServerConfig
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions { freeCompilerArgs.add('-Xjvm-default=all') }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    def props = [
        mod_version : version,
        neo_range   : '[21.1.0,21.2.0)',
        mc_range    : '[1.21.1,1.22)',
        loader_range: '[4,)',
        // ⚠️ voidkit_core 的版本区间**不能用 mod_version**。
        // 早前写死成 "[${mod_version},)" 而 mod_version 是本插件自己的版本，
        // 与 core 实际版本不同 → 区间永不匹配 → 依赖判定失败 →
        // **整个 mod 被加载器静默跳过**（服务端照常 Done，只是没这个 mod）。
        core_range  : "[${coreVersion},)",
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}

jar {
    // 产物命名规格与套件对齐：<mod>-<version>+mc<mc>-<loader>.jar
    archiveFileName = "voidkit_inspector-${version}+mc${mcVersion}-neoforge.jar"
    manifest {
        attributes([
            'Specification-Title'   : 'voidkit_inspector',
            'Specification-Vendor'  : 'Kokuu Studio',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'inspector',
            'Implementation-Version': version,
            'Implementation-Vendor' : 'Kokuu Studio',
        ])
    }
}
