plugins {
    // ⚠️ 1.20.1 用 **legacyforge** 而不是 moddev：
    //    1.20.1 及更早版本 Forge 用 SRG 作为中间映射，ModDevGradle 把
    //    「编译期用官方映射、发布时重混淆成 SRG」这套单独放在 legacyforge 插件里。
    //    官方文档原话：*Forge used SRG mappings as intermediary mappings in
    //    1.20.1 and below. While your mod is developed against the mappings
    //    provided by Mojang (known as official mappings), you need to
    //    reobfuscate it to SRG mappings.*
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

// ==============================================================
// Voidkit Inspector —— 操作审计查询（COI）
//
// 从 Voidkit 套件里拆出的独立模组：记录方块 / 容器 / 实体操作到嵌入式 SQLite，
// 内置科技整合包（机械动力 / Mek / AE2）自动化产线过滤。
//
// 依赖 voidkit_core 前置：
//   - 编译期：compileOnly libs/ 下的 core jar（用 ./fetch-core.sh 下载）
//   - 运行期：由 mods.toml 声明 required，服主同时装 voidkit_core 即可
//
// ⚠️ 本分支 = Minecraft **1.20.1** + Forge 47.x（分支 mc/1.20.1）。
//    1.21.1 + NeoForge 在 main、1.21.1 + Forge 在 mc/1.21.1-forge。
//    业务代码三个分支**逐行相同**，唯一改写面 = platform/forge/ 事件桥
//    + 本文件的构建配置。
// ==============================================================

group = 'org.voidkit'
// 与 voidkit 套件其余模块同一规格：<mod>-0.1.0-beta.1+mc<版本>-<加载器>.jar
version = '0.1.0-beta.1'

base { archivesName = 'voidkit_inspector' }

ext {
    modId = 'voidkit_inspector'
    mcVersion = '1.20.1'
    // ⚠️ 1.20.1 用 **JDK 17**（与 1.21.x 的 21 不同）。
    javaVersion = 17
    forgeVersion = '1.20.1-47.4.20'
    forgeRange = '[47,)'
    mcRange = '[1.20.1,1.20.2)'
    // voidkit_core 的版本 —— **独立于本插件版本**（两个插件各自发版，节奏不同）。
    // 拿本插件版本去写 core 的依赖区间是最隐蔽的坑：区间不匹配 → mod 被静默跳过。
    coreVersion = '0.1.0-beta.1'
    kotlinVersion = '2.1.0'
    sqliteVersion = '3.53.4.0'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaVersion)
kotlin { jvmToolchain(rootProject.ext.javaVersion) }

repositories {
    // NeoForge/Forge 制品国内被 DNS 污染，走官方 CDN（详见 mirror.init.gradle）
    maven { url = 'https://neoforged.forgecdn.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
}

// ⚠️ 1.20.1 的 DSL 块叫 `legacyForge`（不是 `neoForge`）
legacyForge {
    version = rootProject.ext.forgeVersion
    mods {
        'voidkit_inspector' {
            sourceSet(sourceSets.main)
        }
    }
    runs {
        // 开发服务端：core + inspector 都从 classpath 加载，与整合包真实加载路径一致
        server {
            server()
            programArgument '--nogui'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"

    // core 前置：编译期依赖（compileOnly），运行时由服主同装 voidkit_core。
    // ⚠️ 用 fileTree 通配而不是写死文件名 —— core 的版本号与命名规格会变，
    //    写死会导致「fetch-core.sh 下到了，但编译期看不到 core」这种难查的问题。
    // ⚠️ **加载器必须与本分支匹配**：core 的 jar 内含加载器 API，
    //    1.21.1 版的 core 不能顶替 1.20.1（区间匹配不上 → mod 被静默跳过）。
    // Kotlin 运行时也由 core jar 携带（core 是唯一 jarJar kotlin 的），这里不重复 jarJar。
    compileOnly fileTree(dir: 'libs', include: ['voidkit_core-*.jar'])

    // 单元测试（ChainCluster / StructureSense 聚类逻辑是纯数据计算，不需要起 MC 服务端）。
    // core 是 compileOnly，不进 test classpath —— 这里补一份，保证测试编译符号完整。
    testImplementation fileTree(dir: 'libs', include: ['voidkit_core-*.jar'])
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 嵌入式 SQLite 驱动：jarJar 打进本 jar（版本区间只锁下界，让 FML 仲裁）。
    jarJar(implementation('org.xerial:sqlite-jdbc')) {
        version {
            strictly '[3.46,)'
            prefer rootProject.ext.sqliteVersion
        }
    }
}

// ⚠️ 开发运行时（runServer）从 classes 目录加载本模组，jarJar 的嵌套 jar 不生效，
//    所以必须把 Kotlin 运行时、SQLite 原生库、core 的类显式补进 run 的 classpath。
afterEvaluate {
    dependencies {
        additionalRuntimeClasspath "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
        additionalRuntimeClasspath "org.xerial:sqlite-jdbc:${rootProject.ext.sqliteVersion}"
        additionalRuntimeClasspath fileTree(dir: 'libs', include: ['voidkit_core-*.jar'])
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions { freeCompilerArgs.add('-Xjvm-default=all') }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    def props = [
        mod_version : project.version,
        // ⚠️ 占位符沿用 ${neo_range}（toml 里的名字），值是 **Forge 47** 依赖区间。
        neo_range   : rootProject.ext.forgeRange,
        mc_range    : rootProject.ext.mcRange,
        loader_range: rootProject.ext.forgeRange,
        // ⚠️ core 的版本区间**不能用 mod_version**：那是本插件自己的版本，
        // 与 core 实际版本不同 → 区间永不匹配 → 依赖判定失败 → 整个 mod 被跳过。
        core_range  : "[${rootProject.ext.coreVersion},)",
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

// ⚠️⚠️ 1.20.1 的**发布 jar 不由 `jar` 任务产出**：
//     - `jar`      → `build/devlibs/`，**开发态**（官方映射名，只能 dev 环境用）
//     - `reobfJar` → `build/libs/`，**重混淆后的发布态**（SRG 名，正式服要用这个）
//    `reobfJar` 是 MDG 注册的**另一个** Jar 任务，**不会**继承 `jar` 上设的
//    archiveFileName —— 不显式配就会退回 Gradle 默认名 `voidkit_inspector-0.1.0-beta.1.jar`，
//    把版本线信息丢掉（多版本线发布时无法一眼分辨）。
//    `tasks.matching{}` 是惰性的：对 1.21.x 线（没有这个任务）零影响。
//
//    ⚠️ 这与 1.21.1 两条线**完全不同**：它们都用官方映射，不需要 reobf，
//    发布产物就是 `jar`。三条线的发布产物分别来自 jar / jarJar / reobfJar。
tasks.matching { it.name == 'jar' }.configureEach {
    archiveFileName = "${rootProject.ext.modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge-dev.jar"
}
tasks.matching { it.name == 'reobfJar' }.configureEach {
    archiveFileName = "${rootProject.ext.modId}-${project.version}+mc${rootProject.ext.mcVersion}-forge.jar"
    manifest {
        attributes([
            'Specification-Title'   : rootProject.ext.modId,
            'Specification-Vendor'  : 'Kokuu Studio',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'inspector',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'Kokuu Studio',
        ])
    }
}
